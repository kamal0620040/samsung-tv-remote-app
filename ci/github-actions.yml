# Ready-to-use GitHub Actions workflow.
#
# To enable it, move this file to .github/workflows/ci.yml. It is kept here
# because the API token used to publish this repository does not have the
# GitHub "Workflows" permission, so workflow files cannot be pushed through
# it; moving the file in the GitHub web UI (or pushing it with a token that
# has the workflow scope) works.
#
# It deliberately uses gradle/actions/setup-gradle with a pinned Gradle
# version instead of ./gradlew, so it also works on checkouts where the
# wrapper scripts have not been generated yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :tvcore:testDebugUnitTest :app:testDebugUnitTest
      - name: Lint
        run: gradle lint
      - name: Assemble debug APK
        run: gradle assembleDebug

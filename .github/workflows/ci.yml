# GitHub Actions workflow: unit tests, lint, and a debug build on every
# push to main and every pull request.
#
# It deliberately uses gradle/actions/setup-gradle with a pinned Gradle
# version instead of ./gradlew, so it also works on checkouts where the
# wrapper scripts have not been generated yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :tvcore:testDebugUnitTest :app:testDebugUnitTest
      - name: Lint
        run: gradle lint
      - name: Assemble debug APK
        run: gradle assembleDebug
